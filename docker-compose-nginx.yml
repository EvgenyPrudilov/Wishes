services:
  nginx:
    container_name: wishes-nginx-gateway
    image: nginx:stable-alpine
    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - auth-service
      - logging-service
      - config-service
      - wish-service
      - profile-service
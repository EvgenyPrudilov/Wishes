server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемой картинки (по умолчанию в Nginx всего 1МБ)
    client_max_body_size 10M;

### Static Media (Раздача картинок) ###
    location /media/ {
        alias /var/www/uploads/; # Путь к общей папке внутри контейнера Nginx
        expires 1d;             # Кеширование картинок в браузере на 1 дней
        add_header Cache-Control "public, no-transform";

        # Запрещаем скачивание и исполнение потенциально опасных скриптов
        location ~* \.(sh|php|jsp|pl|py|json|xml)$ {
            deny all;
        }
    }

### Profile/Item Service (Куда загружаем картинки) ###
    # Замените пути и имя сервиса (wish-service) на ваши реальные данные
#    location /api/v1/private {
#        proxy_pass http://wish-service:8080;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#    }

### Authentication Service ###

     location /api/v1/public/auth {
         proxy_pass http://auth-service:8080;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     }

     location /api/v1/private/auth {
         proxy_pass http://auth-service:8080;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     }

### Logging Service ###

    location /api/v1/private/logs {
        proxy_pass http://logging-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

### Wish Service ###

    location /api/v1/private/wishlist {
        proxy_pass http://wish-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/public/wishlist {
            proxy_pass http://wish-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
}